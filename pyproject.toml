[project]
name = "g2t-aml"
version = "0.1.0"
description = "Graph2Text AML: graph-conditioned generation of Suspicious Activity Report narratives"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Graph2Text AML authors" }]
keywords = ["anti-money-laundering", "graph-neural-networks", "explainability", "nlg"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
]

# --- core: CPU-only, no CUDA. Phases 1-6 and 10 need nothing beyond this. ---
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "polars==1.9.0",
  "networkx==3.3",
  "jsonschema==4.23.0",
  "pyyaml==6.0.2",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "rich==13.9.2",
  "tqdm==4.66.5",
  "pydantic==2.9.2",
]

[project.optional-dependencies]
# --- graph: CUDA-adjacent.
# torch-scatter / torch-sparse / torch-cluster are deliberately NOT here. Their PyPI
# sdists import torch at build time, so they cannot be resolved into uv.lock at all, and
# the wheels that actually work are the prebuilt ones from data.pyg.org compiled against
# torch 2.4.0 + cu121 exactly. `make install-pyg` installs them. See DECISIONS.md D-007.
graph = [
  "torch==2.4.0",
  "torch-geometric==2.6.1",
  # Phase 7 analysis: AUC-PR, silhouette, the linear probe, the UMAP illustration and the
  # attention figures. scikit-learn and matplotlib are here rather than in `eval` because
  # the encoder's own gate needs them; `eval` is the CPU narrative-metric stack (Phase 10).
  "scikit-learn==1.5.2",
  "matplotlib==3.9.2",
  "umap-learn==0.5.6",
  # Experiment tracking. Never required: the trainer falls back to offline/disabled when
  # no API key is present, so a training run never blocks on network or credentials.
  "wandb==0.18.3",
]

# --- llm: QLoRA finetuning + serving. GPU only. ---
llm = [
  "torch==2.4.0",
  "transformers==4.45.2",
  "peft==0.12.0",
  "bitsandbytes==0.43.3",
  "accelerate==0.33.0",
  "trl==0.9.6",
  "datasets==2.21.0",
  "sentencepiece==0.2.0",
  "vllm==0.6.2",
]

# --- stats: the pure-CPU statistics the measurement modules need, with NO torch.
# Carved out of `eval` because `eval` pulls bert-score, which pulls torch -- and the light
# environment's whole point is that it does not. `eval/statistics.py` and
# `experiments/aggregate.py` are under invariant 1, so CI must actually GATE them rather
# than skip them, and it cannot do that from `eval` without giving up being light. ---
stats = [
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "krippendorff==0.8.0",
]

# --- eval: CPU-only except bert-score, which will use CPU if no GPU is present. ---
eval = [
  "evaluate==0.4.3",
  "sacrebleu==2.4.3",
  "rouge-score==0.1.2",
  "bert-score==0.3.13",
  "nltk==3.9.1",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "krippendorff==0.8.0",
]

# --- api: teacher clients for the Phase 5 Silver build. CPU-only, network-bound.
# Kept out of the core set so Phases 1-4 and every test stay provider-free: the whole
# generate/verify/repair/discard loop is exercised through ScriptedTeacher, which needs
# nothing from here. Only a real generation run needs this extra.
api = [
  "anthropic==0.69.0",
]

# --- human: annotation / adjudication UI. ---
human = [
  "streamlit==1.39.0",
  "plotly==5.24.1",
  # Pure-Python PDF, so `make guidelines-pdf` needs no pandoc, LaTeX or headless browser.
  # The guidelines are a released, cited artifact; their build must not depend on what
  # happens to be installed on the machine that runs it.
  "reportlab==4.2.5",
]

[dependency-groups]
# Installed by default by `uv sync`; kept out of optional-extras so CI stays light.
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "pre-commit==4.0.1",
  "ipykernel==6.29.5",
  "types-PyYAML==6.0.12.20240917",
  "pandas-stubs==2.2.3.241009",
  "hypothesis==6.112.2",
  "types-jsonschema==4.23.0.20240813",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g2t_aml"]

[tool.uv]
# Needed if the PyG companion sdists are ever built from source rather than taken from
# the prebuilt data.pyg.org wheels; they import torch during their build.
no-build-isolation-package = ["torch-scatter", "torch-sparse", "torch-cluster"]

# ---------------------------------------------------------------- ruff ------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # use pathlib
  "RUF",       # ruff-specific
  "ARG",       # unused arguments
  "PL",        # pylint subset
  "D",         # pydocstyle
  "ANN",       # annotations
]
ignore = [
  "D100",   # module docstring not required for every module
  "D104",   # package docstring not required
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "ANN101", # annotating `self` adds nothing
  "ANN102", # ditto `cls`
  "ANN401", # allow Any where genuinely dynamic
  "PLR0913",# many-argument config constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "ARG"]
"scripts/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["g2t_aml"]

# ---------------------------------------------------------------- mypy ------
# Strict typing is scoped to the two measurement modules only. See DECISIONS.md.
[tool.mypy]
python_version = "3.11"
files = ["src/g2t_aml/facts", "src/g2t_aml/eval"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "torch.*", "torch_geometric.*", "evaluate.*", "sacrebleu.*", "rouge_score.*",
  "bert_score.*", "krippendorff.*", "scipy.*", "nltk.*", "transformers.*", "anthropic.*",
]
ignore_missing_imports = true

# D-003 scopes strict typing to facts/ and eval/ ONLY, and that scoping has to survive
# the fact layer importing data/. Without this, `files` pulls data/ and utils/ in as
# followed imports and reports 30-odd numpy `type-arg` errors in modules the decision
# deliberately exempts -- which would either force ignores across untyped-Polars/numpy
# surfaces or push someone to widen the exemption in facts/ instead. `silent` still
# resolves the types facts/ needs; it only suppresses errors raised inside these modules.
[[tool.mypy.overrides]]
module = ["g2t_aml.data.*", "g2t_aml.utils.*", "g2t_aml.corpus.*"]
follow_imports = "silent"

# -------------------------------------------------------------- pytest ------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=g2t_aml",
  "--cov-report=term-missing",
  "--cov-report=xml:artifacts/metrics/coverage.xml",
]
markers = [
  "slow: takes more than a few seconds",
  "gpu: requires a CUDA device",
  "network: requires network access",
  "integration: crosses module boundaries or touches the filesystem end-to-end",
]
filterwarnings = ["error::DeprecationWarning:g2t_aml.*"]

[tool.coverage.run]
branch = true
source = ["src/g2t_aml"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
