# @package eval
name: default

# Faithfulness is the headline family; surface-overlap metrics are reported but are
# explicitly not the contribution.
faithfulness:
  enabled: true
  check_unsupported_facts: true
  check_masked_facts: true     # invariant 4
  check_numeric_fidelity: true
  numeric_tolerance: 0.0       # amounts and counts must match exactly

surface:
  bleu: true
  rouge: true
  bertscore: true
  bertscore_model: microsoft/deberta-xlarge-mnli

human:
  krippendorff_alpha: true
  min_annotators: 2

stats:
  bootstrap_samples: 1000
  confidence: 0.95
  paired_test: bootstrap
