default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # Invariant 8: no real-world identifiers or secrets, ever.
      - id: detect-private-key

  - repo: local
    hooks:
      # Invariant 6 and the .gitignore contract: results and datasets never enter git.
      - id: no-data-or-artifacts
        name: block staged files under data/ or artifacts/
        entry: scripts/hooks/check_no_data_staged.py
        language: script
        pass_filenames: true
        always_run: true
