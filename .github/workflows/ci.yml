name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; CI is a gate, not an archive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  smoke:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # RunContext records the git SHA; a shallow clone is enough for rev-parse.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Light environment only: no CUDA, no torch. Phases 1-6 and 10 need none of it,
      # and a CUDA install would push CI past ten minutes.
      - name: Install light environment
        run: uv sync --group dev --frozen

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: End-to-end smoke run
        run: uv run python scripts/smoke.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/metrics/coverage.xml
          if-no-files-found: ignore

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
